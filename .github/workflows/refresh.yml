name: Refresh radar data

on:
  schedule:
    # 07:00 Asia/Kolkata (UTC+5:30)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh sources and verify links
        run: pnpm refresh

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "nearby-tech[bot]"
          git config user.email "nearby-tech[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh radar data"
          git push
